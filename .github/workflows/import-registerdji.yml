name: Import RegisterDJI source (one time)

on:
  push:
    paths:
      - '.github/workflows/import-registerdji.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: false
      - name: Copy source directly into project root
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout https://github.com/PetsuTHEPRO/RegisterDJI.git /tmp/registerdji-source
          git -C /tmp/registerdji-source checkout --quiet 44fe91bd9e0291b96843371e7ebc917b07421709
          git rm -f RegisterDJI .gitmodules
          rsync -a --exclude='/.git/' /tmp/registerdji-source/ ./
          rm -f .github/workflows/import-registerdji.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Import RegisterDJI source files directly into ai-drone"
          git push origin HEAD:main
