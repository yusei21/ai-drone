name: Rust vision core

on:
  push:
    paths:
      - 'rust/ai-drone-vision/**'
      - '.github/workflows/rust-vision.yml'
  pull_request:
    paths:
      - 'rust/ai-drone-vision/**'
      - '.github/workflows/rust-vision.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Tests
        run: cargo test --manifest-path rust/ai-drone-vision/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path rust/ai-drone-vision/Cargo.toml --all-targets -- -D warnings
